<div class="flex flex-col h-screen bg-gray-900 text-white transition-all duration-300" [class.w-64]="isExpanded()"
    [class.w-16]="!isExpanded()">

    <!-- Logo -->
    <div class="flex items-center gap-3 px-4 py-5 border-b border-gray-700">
        <span class="text-2xl flex-shrink-0">🪑</span>
        @if (isExpanded()) {
        <span class="text-sm font-bold tracking-wide whitespace-nowrap">ConfortMueble</span>
        }
    </div>

    <!-- Menu items -->
    <nav class="flex flex-col gap-1 p-3 flex-1">
        @for (item of menuItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="bg-gray-700 text-white" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-700 hover:text-white
            transition-colors">
            <span class="text-xl flex-shrink-0">{{ item.icon }}</span>
            @if (isExpanded()) {
            <span class="text-sm whitespace-nowrap">{{ item.label }}</span>
            }
        </a>
        }
    </nav>

    <!-- Profile & Logout -->
    <div class="p-3 border-t border-gray-700 flex flex-col gap-1">

        <!-- Profile -->
        <button
            class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-700 hover:text-white transition-colors">
            <span class="text-xl flex-shrink-0">👤</span>
            @if (isExpanded()) {
            <div class="text-left">
                <p class="text-sm text-white">Admin</p>
                <p class="text-xs text-gray-500">admin@confort.com</p>
            </div>
            }
        </button>

        <!-- Logout -->
        <button
            class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-gray-400 hover:bg-red-600 hover:text-white transition-colors">
            <span class="text-xl flex-shrink-0">🚪</span>
            @if (isExpanded()) {
            <span class="text-sm">Cerrar sesión</span>
            }
        </button>

    </div>

    <!-- Toggle button -->
    <div class="p-3 border-t border-gray-700">
        <button (click)="toggle()"
            class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-700 hover:text-white transition-colors">
            <span class="text-xl flex-shrink-0">{{ isExpanded() ? '«' : '»' }}</span>
            @if (isExpanded()) {
            <span class="text-sm">Contraer</span>
            }
        </button>
    </div>

</div>

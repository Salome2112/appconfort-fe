<p-dialog 
  [header]="esEdicion() ? 'Editar Producto' : 'Nuevo Producto'" 
  [visible]="visible()" 
  (visibleChange)="onCerrar()"
  [modal]="true" 
  [style]="{ width: '520px' }" 
  [draggable]="false" 
  [resizable]="false"
>
  <div class="product-form-layout">
    <!-- Row 1: Image & Basic fields -->
    <div class="image-fields-row">
      <!-- Image Upload Col -->
      <div class="image-upload-col">
        <div class="image-preview-box">
          @if (imagePreview()) {
            <img [src]="imagePreview()" alt="preview" />
          } @else if (formData.imageUrl) {
            <img [src]="formData.imageUrl" alt="producto" />
          } @else {
            <span class="placeholder-icon">🛋️</span>
          }
        </div>

        @if (isUploadingImage()) {
          <span class="uploading-text">Subiendo...</span>
        } @else {
          <label class="upload-label">
            Cargar foto
            <input type="file" accept="image/*" class="file-input-hidden" (change)="onImageSelected($event)" />
          </label>
        }
      </div>

      <!-- Basic fields Col -->
      <div class="basic-fields-col">
        <div class="field-group">
          <label for="sku">SKU</label>
          <input pInputText id="sku" [(ngModel)]="formData.sku" placeholder="SOFA-3P-GRS" [disabled]="esEdicion()" />
        </div>

        <div class="field-group">
          <label for="name">Nombre</label>
          <input pInputText id="name" [(ngModel)]="formData.name" placeholder="Sofá 3 Puestos Gris" />
        </div>

        <div class="field-group">
          <label for="category">Categoría</label>
          <select id="category" [(ngModel)]="formData.category" class="custom-select">
            @for (cat of categorias; track cat) {
              <option [value]="cat">{{ cat }}</option>
            }
          </select>
        </div>

        <div class="checkbox-group">
          <input [(ngModel)]="formData.isActive" type="checkbox" id="isActive" />
          <label for="isActive">Producto activo</label>
        </div>
      </div>
    </div>

    <!-- Description field -->
    <div class="field-group">
      <label for="description">Descripción</label>
      <textarea id="description" [(ngModel)]="formData.description" placeholder="Descripción del producto" rows="2" class="custom-textarea"></textarea>
    </div>

    <!-- Financial fields -->
    <div class="financials-row">
      <div class="field-group">
        <label for="basePrice">Precio Base</label>
        <input pInputText id="basePrice" type="number" [(ngModel)]="formData.basePrice" placeholder="0.00" />
      </div>

      <div class="field-group">
        <label for="laborCost">Mano de Obra</label>
        <input pInputText id="laborCost" type="number" [(ngModel)]="formData.laborCost" placeholder="0.00" />
      </div>

      <div class="field-group">
        <label for="profitMargin">Ganancia %</label>
        <input pInputText id="profitMargin" type="number" [(ngModel)]="formData.profitMargin" placeholder="0.00" />
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="footer-container">
      @if (esEdicion()) {
        <p-button label="Eliminar" severity="danger" [text]="true" (onClick)="onEliminar()"></p-button>
      } @else {
        <span></span>
      }
      <div class="actions-right">
        <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="onCerrar()"></p-button>
        <p-button label="Guardar" severity="primary" (onClick)="onGuardar()"></p-button>
      </div>
    </div>
  </ng-template>
</p-dialog>

<div class="quote-items-container">
    <!-- Loading -->
    @if (loading()) {
    <p class="status-text">Cargando...</p>
    }

    <!-- Items list -->
    @if (!loading() && items().length > 0) {
    <p-table [value]="items()" styleClass="p-datatable-sm" [tableStyle]="{ 'min-width': '100%' }">
        <ng-template pTemplate="header">
            <tr>
                <th>Producto</th>
                <th class="text-right" style="text-align: right;">Cant</th>
                <th class="text-right" style="text-align: right;">Subtotal</th>
                <th style="width: 3rem;"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{ item.product.name }}</td>
                <td class="text-right" style="text-align: right;">{{ item.quantity }}</td>
                <td class="text-right" style="text-align: right;">${{ item.subtotal }}</td>
                <td>
                    <p-button icon="pi pi-trash" severity="danger" [text]="true" size="small"
                        (onClick)="removeItem(item.id)"></p-button>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <!-- Total -->
    <div class="total-row">
        <span class="total-label">Total</span>
        <span class="total-value">USD {{ getTotal() }}</span>
    </div>
    }

    <!-- Empty -->
    @if (!loading() && items().length === 0) {
    <p class="status-text empty-text">
        Aún no hay productos agregados.
    </p>
    }
</div>

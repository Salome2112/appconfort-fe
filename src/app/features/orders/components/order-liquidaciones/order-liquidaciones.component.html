<div class="liquidaciones-container">
  @if (loading()) {
    <div class="loading-state">
      <i class="pi pi-spin pi-spinner spinner-icon"></i>
      <p>Cargando información de liquidación...</p>
    </div>
  } @else if (error()) {
    <div class="error-state">
      <i class="pi pi-exclamation-triangle error-icon"></i>
      <p>{{ error() }}</p>
    </div>
  } @else if (salesOrder()) {
    <div class="tables-wrapper">
      <div class="table-column">
        <app-sales-order-table [salesOrder]="salesOrder()"></app-sales-order-table>
      </div>
      <div class="table-column">
        <app-payments-table [payments]="salesOrder().payments || []"></app-payments-table>
      </div>
    </div>

    <app-payment-modal
      [salesOrderId]="salesOrder().id"
      [visible]="isPaymentModalVisible()"
      (closeModal)="isPaymentModalVisible.set(false)"
      (paymentSaved)="onPaymentSaved()"
    ></app-payment-modal>
  } @else {
    <div class="empty-state">
      <i class="pi pi-wallet empty-icon"></i>
      <p>No hay información disponible. Seleccione o cree una proforma primero.</p>
    </div>
  }
</div>

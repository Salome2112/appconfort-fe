<p-dialog 
  header="Registrar Pago" 
  [visible]="visible()" 
  (visibleChange)="onClose()"
  [modal]="true" 
  [style]="{ width: '450px' }" 
  [draggable]="false" 
  [resizable]="false"
>
  <div class="payment-modal-content">
    @if (error()) {
      <div class="error-banner">
        <i class="pi pi-exclamation-circle error-banner-icon"></i>
        <span>{{ error() }}</span>
      </div>
    }

    <form (submit)="$event.preventDefault(); savePayment()" class="payment-form">
      <!-- Método de Pago -->
      <div class="form-field">
        <label for="paymentMethod" class="field-label">Método de Pago</label>
        <div class="select-wrapper">
          <select 
            id="paymentMethod" 
            [ngModel]="paymentMethod()" 
            (ngModelChange)="paymentMethod.set($event)" 
            name="paymentMethod"
            class="custom-select"
            required
          >
            <option value="CASH">Efectivo</option>
            <option value="BANK_TRANSFER">Transferencia Bancaria</option>
            <option value="CREDIT_CARD">Tarjeta de Crédito</option>
            <option value="DEBIT_CARD">Tarjeta de Débito</option>
            <option value="CHECK">Cheque</option>
          </select>
        </div>
      </div>

      <!-- Monto -->
      <div class="form-field">
        <label for="amount" class="field-label">Monto (USD)</label>
        <input 
          pInputText
          type="number" 
          id="amount" 
          [ngModel]="amount()" 
          (ngModelChange)="amount.set($event)" 
          name="amount"
          placeholder="0.00"
          step="0.01"
          min="0.01"
          class="custom-input"
          required
        />
      </div>

      <!-- Notas / Referencia -->
      <div class="form-field">
        <label for="notes" class="field-label">Notas / Referencia (Opcional)</label>
        <textarea 
          id="notes" 
          [ngModel]="notes()" 
          (ngModelChange)="notes.set($event)" 
          name="notes"
          placeholder="Ej. Transferencia Banco Pichincha Ref. 987654"
          class="custom-textarea"
          rows="3"
        ></textarea>
      </div>

      <!-- Botón invisible para permitir submit con Enter -->
      <button type="submit" style="display: none;"></button>
    </form>
  </div>

  <ng-template pTemplate="footer">
    <div class="footer-buttons">
      <p-button 
        label="Cancelar" 
        severity="secondary" 
        [text]="true" 
        (onClick)="onClose()"
        [disabled]="loading()"
      ></p-button>
      <p-button 
        label="Registrar Pago" 
        icon="pi pi-check"
        severity="success"
        [loading]="loading()"
        (onClick)="savePayment()"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>

<div class="flex-1">
    <h2 class="text-lg font-bold text-gray-800 mb-4">Productos</h2>

    <!-- Search input -->
    <input type="text" [ngModel]="searchText()" (ngModelChange)="searchText.set($event)" placeholder="Buscarproducto..."
        class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4" />

    <!-- Product list -->
    <div class="flex flex-col gap-3">
        @for (product of filteredProducts(); track product.id) {
        <div class="flex items-center gap-3 border rounded-xl p-3 hover:bg-gray-50">

            <!-- Thumbnail placeholder -->
            <div class="w-16 h-16 rounded-lg bg-gray-100 flex items-center justify-center flex-shrink-0">

                <span class="text-2xl">🛋️</span>

            </div>

            <!-- Info -->
            <div class="flex-1">
                <p class="text-sm font-medium text-gray-800">{{ product.name }}</p>
                <p class="text-xs text-gray-400">{{ product.sku }}</p>
                <p class="text-sm font-semibold text-indigo-600 mt-1">${{ product.basePrice }}</p>
            </div>

            <!-- Quantity + Add -->
            <div class="flex flex-col items-center gap-2">

                <!-- Quantity controls -->
                <div class="flex items-center border rounded-lg overflow-hidden">
                    <button (click)="decrement(product.id)"
                        class="px-2 py-1 text-gray-600 hover:bg-gray-100 transition text-sm">
                        −
                    </button>
                    <span class="px-3 py-1 text-sm font-medium text-gray-800">
                        {{ getQuantity(product.id) }}
                    </span>
                    <button (click)="increment(product.id)"
                        class="px-2 py-1 text-gray-600 hover:bg-gray-100 transition text-sm">
                        +
                    </button>
                </div>

                <!-- Add button -->
                <button (click)="addProduct(product)"
                    class="w-full px-3 py-1.5 bg-gray-800 text-white text-xs rounded-lg hover:bg-gray-900 transition">
                    + Add
                </button>

            </div>

        </div>
        }

        @if (filteredProducts.length === 0) {
        <p class="text-sm text-gray-400 text-center py-4">
            No se encontraron productos.
        </p>
        }
    </div>
</div>

<div class="flex-1">
    <h2 class="text-lg font-bold text-gray-800 mb-4">Productos</h2>

    <!-- Search input -->
    <input type="text" [ngModel]="searchText()" (ngModelChange)="searchText.set($event)" placeholder="Buscarproducto..."
        class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4" />

    <!-- Product list -->
    <div class="flex flex-col gap-3">
        @for (product of filteredProducts(); track product.id) {
        <div class="flex items-center justify-between border rounded-xl p-3 hover:bg-gray-50">
            <div>
                <p class="text-sm font-medium text-gray-800">{{ product.name }}</p>
                <p class="text-xs text-gray-400">{{ product.sku }}</p>
                <p class="text-sm font-semibold text-indigo-600 mt-1">${{ product.basePrice }}</p>
            </div>
            <button (click)="addProduct(product)"
                class="px-3 py-1.5 bg-gray-800 text-white text-xs rounded-lg hover:bg-gray-900 transition">
                + Add
            </button>
        </div>
        }

        <!-- No results -->
        @if (filteredProducts().length === 0) {
        <p class="text-sm text-gray-400 text-center py-4">
            No se encontraron productos.
        </p>
        }
    </div>
</div>

<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">

        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-gray-800">Select Customer</h2>
            <button (click)="onClose()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
        </div> <!-- Loading -->

        <div class="mb-4">
            <input type="text" placeholder="Search customer..." [ngModel]="searchText()"
                (ngModelChange)="searchText.set($event)" placeholder="Buscar por nombre o NUI..."
                class="w-full px-3 py-2 border rounded-lg focus:outline-indigo-600" />
        </div>
        <!-- Loading -->
        @if (loading()) {
        <p class="text-gray-400 text-sm text-center py-4">Cargando clientes...</p>
        }

        <!-- List -->
        @if (!loading()) {
        <ul class="divide-y divide-gray-100">
            @for (client of filteredClients(); track client.id) {
            <li (click)="selectCustomer(client)"
                class="py-3 flex justify-between items-center hover:bg-gray-50 cursor-pointer px-2 rounded-lg">
                <div>
                    <p class="text-sm font-medium text-gray-800">
                        {{ client.firstName }} {{ client.lastName }}
                    </p>
                    <p class="text-xs text-gray-500">{{ client.email }}</p>
                </div>
                <span class="text-xs text-indigo-600 font-medium">Seleccionar →</span>
            </li>
            }
        </ul>
        }




    </div>
</div>

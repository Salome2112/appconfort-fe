@if (isLoginPage()) {
  <router-outlet />
} @else {
  <div class="app-layout" [class.sidebar-hidden]="sidebarHidden()">
    <!-- Barra Lateral (Sidebar Component) -->
    <app-sidebar></app-sidebar>

    <!-- Contenido Principal -->
    <main class="main-content">
      <p-button
        [rounded]="true"
        [text]="true"
        severity="secondary"
        styleClass="sidebar-toggle-btn"
        (onClick)="toggleSidebar()"
        [attr.aria-label]="sidebarHidden() ? 'Mostrar barra lateral' : 'Ocultar barra lateral'"
      >
        <i class="pi pi-bars"></i>
      </p-button>

      <div class="content-wrapper">
        <router-outlet />
      </div>
    </main>
  </div>
}
